# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [published]
  push:
    branches: [ main, master, bce-sdk-node-next ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify TypeScript installation
        run: |
          echo "Checking TypeScript installation..."
          ls -la node_modules/typescript/bin/ || echo "TypeScript bin directory not found"
          node -e "console.log('TypeScript version:', require('typescript/package.json').version)" || echo "TypeScript not found"
      - name: Type check
        run: npm run type-check
      - name: Build TypeScript
        run: npm run build
      - name: Run tests
        run: npm test
        continue-on-error: true

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org/
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build for production
        run: npm run build
      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
